<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ヨット部 配車ツール</title>
<style>
  :root {
    --deep: #0b3d5c;
    --sea: #1273a6;
    --sea-light: #3fa7d6;
    --foam: #e8f6fb;
    --sand: #fdf6ec;
    --coral: #ff7b6b;
    --seaweed: #1f9e89;
    --card: #ffffff;
    --text: #10394f;
    --muted: #5b7f93;
    --radius: 18px;
    --shadow: 0 6px 20px rgba(11, 61, 92, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    background: linear-gradient(180deg, #cfeefb 0%, #e8f6fb 40%, #fdf6ec 100%);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
  }
  .ocean-header {
    background: linear-gradient(160deg, var(--deep) 0%, var(--sea) 60%, var(--sea-light) 100%);
    color: #fff;
    padding: 10px 16px 22px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    overflow: hidden;
  }
  .ocean-header h1 {
    font-size: 1.25rem;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .wave {
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    width: 100%;
    height: 18px;
    display: block;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 10px 12px calc(96px + env(safe-area-inset-bottom));
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px;
    margin-bottom: 8px;
  }
  .card-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--sea);
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  /* 全体人数（開閉できる内訳） */
  .member-summary {
    display: block;
    cursor: pointer;
    list-style: none;
    touch-action: manipulation;
  }
  .member-summary::-webkit-details-marker { display: none; }
  .member-summary .card-title { margin-bottom: 0; }
  .summary-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .summary-right {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  /* 閉じているとき＝直接入力、開いているとき＝合計の表示のみ */
  details[open] #totalStepperSlot { display: none; }
  details:not([open]) .summary-total,
  details:not([open]) .summary-unit { display: none; }
  .stepper--total button { width: 38px; height: 38px; font-size: 1.3rem; }
  .stepper--total input.value {
    height: 38px;
    width: 2.7em;
    font-size: 1.3rem;
  }
  .stepper--total .unit { margin-left: -2px; }
  .summary-total {
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--sea);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .chevron {
    width: 20px;
    height: 20px;
    color: var(--sea-light);
    margin-left: 4px;
    align-self: center;
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  details[open] .chevron { transform: rotate(180deg); }
  .member-body {
    margin-top: 8px;
    padding-top: 4px;
    border-top: 1px dashed #d7ebf4;
  }
  .member-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px dashed #d7ebf4;
  }
  .member-row:last-child { border-bottom: none; }
  .member-name {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 0.95rem;
  }
  .member-name .icon { font-size: 1.2rem; }
  .stepper {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stepper button {
    width: 44px; height: 44px;
    border: none;
    border-radius: 50%;
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
    background: var(--sea-light);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(18, 115, 166, 0.3);
    transition: transform 0.08s, background 0.15s;
    touch-action: manipulation;
    user-select: none;
  }
  .stepper button:active { transform: scale(0.9); background: var(--sea); }
  .stepper .minus { background: #9fbfd1; box-shadow: 0 3px 8px rgba(91, 127, 147, 0.3); }
  .stepper .minus:active { background: var(--muted); }
  .stepper .value {
    min-width: 2.2em;
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stepper input.value {
    border: 2px solid #d7ebf4;
    border-radius: 10px;
    height: 44px;
    width: 3em;
    background: var(--foam);
    color: var(--text);
    /* 数値入力の上下スピナーを消し、＋−ボタンだけで操作させる */
    appearance: textfield;
    -moz-appearance: textfield;
  }
  .stepper input.value::-webkit-outer-spin-button,
  .stepper input.value::-webkit-inner-spin-button {
    -webkit-appearance: none;
    appearance: none;
    margin: 0;
  }
  .stepper input.value:focus { outline: none; border-color: var(--sea-light); }
  .unit { font-size: 0.8rem; color: var(--muted); }
  /* 車リスト */
  .car-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px dashed #d7ebf4;
  }
  .car-row:last-of-type { border-bottom: none; }
  .car-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    flex: 1;
    min-width: 0;
  }
  .car-name .icon { font-size: 1.2rem; }
  .car-name input {
    border: none;
    background: transparent;
    font: inherit;
    color: inherit;
    width: 100%;
    min-width: 0;
    border-bottom: 1px dashed transparent;
  }
  .car-name input:focus { outline: none; border-bottom-color: var(--sea-light); }
  .remove-car {
    border: none;
    background: transparent;
    color: #c9d8e0;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 6px;
    line-height: 1;
    touch-action: manipulation;
  }
  .remove-car:active { color: var(--coral); }
  .add-car {
    width: 100%;
    margin-top: 8px;
    padding: 11px;
    border: 2px dashed var(--sea-light);
    border-radius: 14px;
    background: var(--foam);
    color: var(--sea);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s;
  }
  .add-car:active { background: #d3edf8; }
  /* その他の移動手段 */
  .other-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px dashed #d7ebf4;
  }
  .other-row:last-child { border-bottom: none; }
  .other-name {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 0.95rem;
  }
  .other-name .icon { font-size: 1.2rem; }
  /* 結果バー */
  .result-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(8px);
    border-top: 1px solid #d7ebf4;
    box-shadow: 0 -6px 20px rgba(11, 61, 92, 0.12);
    padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
  }
  .result-inner {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .result-detail {
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  .result-main {
    text-align: right;
    font-weight: 700;
  }
  .result-main .label { font-size: 0.75rem; color: var(--muted); margin-right: 6px; }
  .result-main .number {
    font-size: 1.9rem;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .result-main.ok .number { color: var(--seaweed); }
  .result-main.short .number { color: var(--coral); }
  .result-main.over .number { color: var(--sea); }
  .status-msg {
    font-size: 0.78rem;
    font-weight: 700;
    margin-top: 2px;
  }
  .result-main.ok .status-msg { color: var(--seaweed); }
  .result-main.short .status-msg { color: var(--coral); }
  .result-main.over .status-msg { color: var(--sea); }
  .reset-btn {
    flex-shrink: 0;
    display: block;
    margin: 0;
    padding: 6px 12px;
    border: none;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
    font-size: 0.8rem;
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  /* ヘッダーのボタン */
  .header-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .header-btn {
    padding: 7px 13px;
    border: none;
    border-radius: 999px;
    background: #fff;
    color: var(--sea);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .header-btn.subtle {
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
    font-weight: 400;
  }
  .header-btn:active { transform: scale(0.94); }
  /* 画像出力のプレビュー */
  .shot-overlay {
    position: fixed;
    inset: 0;
    background: rgba(11, 61, 92, 0.6);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    z-index: 50;
  }
  .shot-overlay img {
    max-width: 100%;
    max-height: 66vh;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .shot-hint {
    color: #fff;
    font-size: 0.78rem;
    text-align: center;
    line-height: 1.6;
  }
  .shot-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .shot-actions button, .shot-actions a {
    padding: 11px 20px;
    border: none;
    border-radius: 999px;
    background: #fff;
    color: var(--sea);
    font-size: 0.9rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  .shot-actions .ghost { background: rgba(255, 255, 255, 0.2); color: #fff; }
  .shot-date {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .shot-date input {
    width: 9em;
    padding: 8px 12px;
    border: none;
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-weight: 700;
    text-align: center;
  }
  .shot-date input:focus { outline: 2px solid var(--sea-light); }
</style>
</head>
<body>

<header class="ocean-header">
  <h1>🌊 ヨット部 配車ツール</h1>
  <div class="header-actions">
    <button type="button" class="header-btn" id="shotBtn">共有</button>
    <button type="button" class="header-btn subtle" id="resetBtn">リセット</button>
  </div>
  <svg class="wave" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,30 C240,60 480,0 720,30 C960,60 1200,0 1440,30 L1440,60 L0,60 Z" fill="#cfeefb"></path>
  </svg>
</header>

<main>
  <!-- 全体人数 -->
  <section class="card">
    <details id="memberDetails">
      <summary class="member-summary">
        <div class="summary-top">
          <div class="card-title">👥 全体の人数</div>
          <div class="summary-right">
            <!-- 閉じているときだけ出る、全体人数の直接入力 -->
            <div id="totalStepperSlot"></div>
            <span class="summary-total" id="summaryTotal">0</span>
            <span class="unit summary-unit">人</span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </summary>
      <div class="member-body" id="memberList"></div>
    </details>
  </section>

  <!-- 車 -->
  <section class="card">
    <div class="card-title">🚗 車（乗れる人数）</div>
    <div id="carList"></div>
    <button type="button" class="add-car" id="addCarBtn">＋ 車を追加</button>
  </section>

  <!-- その他の移動手段 -->
  <section class="card">
    <div class="card-title">🚏 その他の移動手段</div>
    <div id="otherList"></div>
  </section>

</main>

<!-- 結果バー -->
<div class="result-bar">
  <div class="result-inner">
    <div class="result-detail" id="resultDetail"></div>
    <div class="result-main" id="resultMain">
      <span class="label">過不足</span>
      <span class="number" id="remainNumber">0</span>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = "haisha-tool-v1";

  var defaultState = {
    members: [
      { key: "player",  name: "プレイヤー",   icon: "⛵", count: 0 },
      { key: "manager", name: "マネージャー", icon: "📋", count: 0 },
      { key: "coach",   name: "コーチ",       icon: "📣", count: 0 }
    ],
    cars: [{ name: "車1", capacity: 4 }],
    others: [
      { key: "moped",  name: "原付",   icon: "🛵", count: 0 },
      { key: "bus",    name: "バス",   icon: "🚌", count: 0 },
      { key: "bike",   name: "自転車", icon: "🚲", count: 0 }
    ]
  };

  var state = loadState();

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.cars) && Array.isArray(parsed.others)) {
          if (!Array.isArray(parsed.members)) {
            // 内訳を持たない旧データは、全体人数をプレイヤーに移す
            parsed.members = JSON.parse(JSON.stringify(defaultState.members));
            parsed.members[0].count = typeof parsed.total === "number" ? parsed.total : 0;
          }
          delete parsed.total;
          // 名前とアイコンは常に最新の定義に合わせ、人数だけ引き継ぐ
          refreshLabels(parsed.members, defaultState.members);
          refreshLabels(parsed.others, defaultState.others);
          return parsed;
        }
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(defaultState));
  }

  function refreshLabels(saved, defaults) {
    if (!Array.isArray(saved)) return;
    saved.forEach(function (item) {
      defaults.forEach(function (def) {
        if (def.key && item.key === def.key) {
          item.name = def.name;
          item.icon = def.icon;
        }
      });
    });
  }

  function totalPeople() {
    return state.members.reduce(function (s, m) { return s + m.count; }, 0);
  }

  // 閉じた状態で全体人数を直接いじったときの配分。
  // 増えた分はプレイヤーに足し、減った分はプレイヤー→マネージャー→コーチの順に引く。
  function setTotalPeople(v) {
    var delta = v - totalPeople();
    if (delta > 0) {
      state.members[0].count += delta;
    } else {
      var rest = -delta;
      for (var i = 0; i < state.members.length && rest > 0; i++) {
        var take = Math.min(state.members[i].count, rest);
        state.members[i].count -= take;
        rest -= take;
      }
    }
    renderMembers();
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  var memberList = document.getElementById("memberList");
  var carList = document.getElementById("carList");
  var otherList = document.getElementById("otherList");

  // editable を渡すと、数字を直接キーボードで打ち込める入力欄になる
  function makeStepper(getValue, setValue, unit, label, editable) {
    var wrap = document.createElement("div");
    wrap.className = "stepper";

    var minus = document.createElement("button");
    minus.type = "button";
    minus.className = "minus";
    minus.textContent = "−";
    minus.setAttribute("aria-label", label + "を減らす");

    var value;
    if (editable) {
      value = document.createElement("input");
      value.type = "number";
      value.inputMode = "numeric";
      value.min = "0";
      value.value = getValue();
      value.setAttribute("aria-label", label);
      value.addEventListener("input", function () {
        var v = parseInt(value.value, 10);
        setValue(isNaN(v) || v < 0 ? 0 : v);
        update();
      });
      value.addEventListener("blur", function () {
        value.value = getValue();
      });
    } else {
      value = document.createElement("span");
      value.textContent = getValue();
    }
    value.className = "value";

    var plus = document.createElement("button");
    plus.type = "button";
    plus.textContent = "＋";
    plus.setAttribute("aria-label", label + "を増やす");

    var unitEl = document.createElement("span");
    unitEl.className = "unit";
    unitEl.textContent = unit;

    function setDisplayed(v) {
      setValue(v);
      if (editable) { value.value = v; } else { value.textContent = v; }
      update();
    }
    minus.addEventListener("click", function () {
      setDisplayed(Math.max(0, getValue() - 1));
    });
    plus.addEventListener("click", function () {
      setDisplayed(getValue() + 1);
    });

    wrap.appendChild(minus);
    wrap.appendChild(value);
    wrap.appendChild(plus);
    wrap.appendChild(unitEl);
    return wrap;
  }

  function renderMembers() {
    memberList.innerHTML = "";
    state.members.forEach(function (member) {
      var row = document.createElement("div");
      row.className = "member-row";

      var nameWrap = document.createElement("div");
      nameWrap.className = "member-name";
      var icon = document.createElement("span");
      icon.className = "icon";
      icon.textContent = member.icon;
      var name = document.createElement("span");
      name.textContent = member.name;
      nameWrap.appendChild(icon);
      nameWrap.appendChild(name);

      var stepper = makeStepper(
        function () { return member.count; },
        function (v) { member.count = v; },
        "人",
        member.name,
        true
      );

      row.appendChild(nameWrap);
      row.appendChild(stepper);
      memberList.appendChild(row);
    });
  }

  function renderCars() {
    carList.innerHTML = "";
    state.cars.forEach(function (car, i) {
      var row = document.createElement("div");
      row.className = "car-row";

      var nameWrap = document.createElement("div");
      nameWrap.className = "car-name";
      var icon = document.createElement("span");
      icon.className = "icon";
      icon.textContent = "🚗";
      var nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.value = car.name;
      nameInput.setAttribute("aria-label", "車の名前");
      nameInput.addEventListener("input", function () {
        car.name = nameInput.value;
        saveState();
      });
      nameWrap.appendChild(icon);
      nameWrap.appendChild(nameInput);

      var stepper = makeStepper(
        function () { return car.capacity; },
        function (v) { car.capacity = v; },
        "人",
        "乗れる人数"
      );

      var removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "remove-car";
      removeBtn.textContent = "✕";
      removeBtn.setAttribute("aria-label", car.name + " を削除");
      removeBtn.addEventListener("click", function () {
        state.cars.splice(i, 1);
        renderCars();
        update();
      });

      row.appendChild(nameWrap);
      row.appendChild(stepper);
      row.appendChild(removeBtn);
      carList.appendChild(row);
    });
  }

  function renderOthers() {
    otherList.innerHTML = "";
    state.others.forEach(function (other) {
      var row = document.createElement("div");
      row.className = "other-row";

      var nameWrap = document.createElement("div");
      nameWrap.className = "other-name";
      var icon = document.createElement("span");
      icon.className = "icon";
      icon.textContent = other.icon;
      var name = document.createElement("span");
      name.textContent = other.name;
      nameWrap.appendChild(icon);
      nameWrap.appendChild(name);

      var stepper = makeStepper(
        function () { return other.count; },
        function (v) { other.count = v; },
        "人",
        other.name
      );

      row.appendChild(nameWrap);
      row.appendChild(stepper);
      otherList.appendChild(row);
    });
  }

  function update() {
    var total = totalPeople();
    var carSum = state.cars.reduce(function (s, c) { return s + c.capacity; }, 0);
    var otherSum = state.others.reduce(function (s, o) { return s + o.count; }, 0);
    var capacity = carSum + otherSum;
    var diff = capacity - total; // マイナス＝人数がたりない

    document.getElementById("summaryTotal").textContent = total;
    // 内訳をいじって合計が変わったときも、直接入力欄を合わせておく
    if (totalStepperInput && document.activeElement !== totalStepperInput) {
      totalStepperInput.value = total;
    }

    var detail = document.getElementById("resultDetail");
    detail.innerHTML =
      "全体 <b>" + total + "</b> 人 ／ 乗れる <b>" + capacity + "</b> 人<br>" +
      "車 " + carSum + "（" + state.cars.length + "台） ＋ その他 " + otherSum;

    var main = document.getElementById("resultMain");
    var num = document.getElementById("remainNumber");
    var msg = document.getElementById("statusMsg");

    main.classList.remove("ok", "short", "over");
    if (diff < 0) {
      num.textContent = "−" + (-diff);
      main.classList.add("short");
      msg.textContent = "あと " + (-diff) + " 人分たりません";
    } else if (diff === 0) {
      num.textContent = "±0";
      main.classList.add("ok");
      msg.textContent = "ぴったり全員乗れます 🐬";
    } else {
      num.textContent = "+" + diff;
      main.classList.add("over");
      msg.textContent = diff + " 人分の余裕があります";
    }

    saveState();
  }

  // 閉じているときに出る、全体人数の直接入力。
  // summary の中にあるので、操作しても details が開閉しないよう伝播を止める。
  var totalStepper = makeStepper(totalPeople, setTotalPeople, "人", "全体の人数", true);
  totalStepper.className += " stepper--total";
  ["click", "keydown"].forEach(function (type) {
    totalStepper.addEventListener(type, function (e) { e.stopPropagation(); });
  });
  document.getElementById("totalStepperSlot").appendChild(totalStepper);
  var totalStepperInput = totalStepper.querySelector("input.value");

  // 車を追加
  document.getElementById("addCarBtn").addEventListener("click", function () {
    state.cars.push({ name: "車" + (state.cars.length + 1), capacity: 4 });
    renderCars();
    update();
  });

  // リセット
  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!confirm("すべての入力をリセットしますか？")) return;
    state = JSON.parse(JSON.stringify(defaultState));
    renderMembers();
    renderCars();
    renderOthers();
    update();
  });

  // 初期表示
  renderMembers();
  renderCars();
  renderOthers();
  update();

  // ===== まとめを1枚の画像にする =====
  var FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif';

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 描く行を先に組み立てて、必要な高さを決めてから描画する
  function buildLines() {
    var lines = [];
    var total = totalPeople();
    var used = state.members.filter(function (m) { return m.count > 0; });

    lines.push({ type: "section", text: "全体の人数" });
    lines.push({ type: "row", label: "参加人数", value: total + " 人", strong: true });
    used.forEach(function (m) {
      lines.push({ type: "sub", label: m.icon + " " + m.name, value: m.count + " 人" });
    });

    lines.push({ type: "section", text: "車" });
    if (state.cars.length === 0) {
      lines.push({ type: "sub", label: "（なし）", value: "" });
    } else {
      state.cars.forEach(function (c) {
        lines.push({ type: "row", label: "🚗 " + (c.name || "車"), value: c.capacity + " 人" });
      });
    }

    var others = state.others.filter(function (o) { return o.count > 0; });
    if (others.length) {
      lines.push({ type: "section", text: "その他の移動手段" });
      others.forEach(function (o) {
        lines.push({ type: "row", label: o.icon + " " + o.name, value: o.count + " 人" });
      });
    }
    return lines;
  }

  function drawSummary(dateLabel) {
    var W = 720, PAD = 36, HEAD = 104;
    var lines = buildLines();

    var lineH = function (t) {
      return t === "section" ? 46 : (t === "sub" ? 32 : 42);
    };
    var body = lines.reduce(function (s, l) { return s + lineH(l.type); }, 0);
    var FOOT = 168;
    var H = HEAD + 16 + body + FOOT;

    var dpr = 2;
    var cv = document.createElement("canvas");
    cv.width = W * dpr; cv.height = H * dpr;
    var ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.textBaseline = "middle";

    // 背景
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#e8f6fb");
    bg.addColorStop(1, "#fdf6ec");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ヘッダー
    var hg = ctx.createLinearGradient(0, 0, W, HEAD);
    hg.addColorStop(0, "#0b3d5c");
    hg.addColorStop(0.6, "#1273a6");
    hg.addColorStop(1, "#3fa7d6");
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, W, HEAD);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 30px " + FONT;
    ctx.textAlign = "left";
    ctx.fillText("🌊 ヨット部 配車まとめ", PAD, HEAD / 2);

    ctx.font = "20px " + FONT;
    ctx.textAlign = "right";
    ctx.fillText(dateLabel, W - PAD, HEAD / 2);

    // 本文
    var y = HEAD + 16;
    lines.forEach(function (l) {
      var h = lineH(l.type);
      if (l.type === "section") {
        ctx.textAlign = "left";
        ctx.fillStyle = "#1273a6";
        ctx.font = "bold 20px " + FONT;
        ctx.fillText(l.text, PAD, y + h / 2 + 4);
      } else {
        var isSub = l.type === "sub";
        ctx.textAlign = "left";
        ctx.fillStyle = isSub ? "#5b7f93" : "#10394f";
        ctx.font = (l.strong ? "bold " : "") + (isSub ? "20px " : "24px ") + FONT;
        ctx.fillText(l.label, PAD + (isSub ? 22 : 8), y + h / 2);
        ctx.textAlign = "right";
        ctx.font = (l.strong ? "bold 26px " : (isSub ? "20px " : "24px ")) + FONT;
        ctx.fillText(l.value, W - PAD, y + h / 2);
      }
      y += h;
    });

    // 結果
    var carSum = state.cars.reduce(function (s, c) { return s + c.capacity; }, 0);
    var otherSum = state.others.reduce(function (s, o) { return s + o.count; }, 0);
    var capacity = carSum + otherSum;
    var diff = capacity - totalPeople();

    var boxY = H - FOOT + 8, boxH = FOOT - 28;
    ctx.fillStyle = "#fff";
    roundRect(ctx, PAD - 12, boxY, W - (PAD - 12) * 2, boxH, 16);
    ctx.fill();

    ctx.textAlign = "left";
    ctx.fillStyle = "#5b7f93";
    ctx.font = "20px " + FONT;
    ctx.fillText("乗れる合計", PAD + 8, boxY + 34);
    ctx.textAlign = "right";
    ctx.fillStyle = "#10394f";
    ctx.font = "bold 24px " + FONT;
    ctx.fillText(capacity + " 人", W - PAD, boxY + 34);

    var color = diff < 0 ? "#ff7b6b" : (diff === 0 ? "#1f9e89" : "#1273a6");
    var big = diff < 0 ? "−" + (-diff) : (diff === 0 ? "±0" : "+" + diff);
    var msg = diff < 0 ? "あと " + (-diff) + " 人分たりません"
            : (diff === 0 ? "ぴったり全員乗れます" : diff + " 人分の余裕があります");

    ctx.textAlign = "left";
    ctx.fillStyle = "#5b7f93";
    ctx.font = "20px " + FONT;
    ctx.fillText("過不足", PAD + 8, boxY + 88);
    ctx.textAlign = "right";
    ctx.fillStyle = color;
    ctx.font = "bold 44px " + FONT;
    ctx.fillText(big, W - PAD, boxY + 88);
    ctx.font = "bold 19px " + FONT;
    ctx.fillText(msg, W - PAD, boxY + 122);

    return cv;
  }

  function openShot() {
    var today = new Date();
    var label = (today.getMonth() + 1) + "/" + today.getDate();
    var cv, shotFile;

    var ov = document.createElement("div");
    ov.className = "shot-overlay";

    // 日付は自由に書き換えられる（「9/6 合宿」のような書き方もできる）
    var dateRow = document.createElement("div");
    dateRow.className = "shot-date";
    var dateLabelEl = document.createElement("label");
    dateLabelEl.textContent = "日付";
    dateLabelEl.setAttribute("for", "shotDateInput");
    var dateInput = document.createElement("input");
    dateInput.type = "text";
    dateInput.id = "shotDateInput";
    dateInput.value = label;
    dateInput.setAttribute("aria-label", "画像に入れる日付");
    dateRow.appendChild(dateLabelEl);
    dateRow.appendChild(dateInput);

    var img = document.createElement("img");
    img.alt = "配車まとめ";

    var hint = document.createElement("div");
    hint.className = "shot-hint";
    hint.textContent = "画像を長押しすると保存できます";

    var actions = document.createElement("div");
    actions.className = "shot-actions";

    // 描き直して、表示と共有用ファイルの両方を差し替える
    function render() {
      cv = drawSummary(dateInput.value);
      img.src = cv.toDataURL("image/png");
      shotFile = null;
      if (cv.toBlob) {
        cv.toBlob(function (blob) {
          try {
            shotFile = new File([blob], "haisha-" + today.getFullYear() +
              ("0" + (today.getMonth() + 1)).slice(-2) +
              ("0" + today.getDate()).slice(-2) + ".png", { type: "image/png" });
          } catch (e) {}
        });
      }
    }
    dateInput.addEventListener("input", render);
    render();

    // 共有（対応端末のみ）。LINE などにそのまま送れる。
    if (navigator.canShare) {
      var shareBtn = document.createElement("button");
      shareBtn.type = "button";
      shareBtn.textContent = "共有する";
      // iOS は共有をタップと同じ処理の中で呼ぶ必要があるため、
      // ファイルはあらかじめ作っておき、タップ時は同期的に share() する。
      shareBtn.addEventListener("click", function () {
        if (shotFile && navigator.canShare({ files: [shotFile] })) {
          navigator.share({ files: [shotFile] }).catch(function () {});
        }
      });
      actions.appendChild(shareBtn);
    }

    var close = document.createElement("button");
    close.type = "button";
    close.className = "ghost";
    close.textContent = "閉じる";
    close.addEventListener("click", function () { ov.remove(); });
    actions.appendChild(close);

    ov.appendChild(dateRow);
    ov.appendChild(img);
    ov.appendChild(hint);
    ov.appendChild(actions);
    ov.addEventListener("click", function (e) { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  }

  document.getElementById("shotBtn").addEventListener("click", openShot);
})();
</script>
</body>
</html>
